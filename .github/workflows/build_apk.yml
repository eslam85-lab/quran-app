name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate & validate Quran data (fails unless 114 surahs / 6236 verses / 604 pages)
        run: python tools/generate_quran.py

      - name: Verify bundled fonts and data
        run: |
          for f in assets/fonts/AmiriQuran-Regular.ttf assets/fonts/Amiri-Regular.ttf assets/fonts/Amiri-Bold.ttf \
                   assets/fonts/Tajawal-Regular.ttf assets/fonts/Tajawal-Medium.ttf assets/fonts/Tajawal-Bold.ttf \
                   assets/quran/quran.json assets/quran/tafsir.json assets/quran/mushaf.json; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files, permissions and launcher icon
        run: |
          flutter create . --platforms=android --project-name quran_app --org com.eslam.quran
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="إسلام"#' $M
          cp -r assets/branding/android/* android/app/src/main/res/

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: quran-apk
          path: build/app/outputs/flutter-apk/app-release.apk
                - uses: actions/upload-artifact@v4
        with:
          name: quran-data
          path: assets/quran/*.json
